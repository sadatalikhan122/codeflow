<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FastAPI Ollama Chatbot</title>
  <style>
    :root { font-family: system-ui, Arial, sans-serif; color-scheme: light; }
    body { max-width: 720px; margin: 48px auto; padding: 0 16px; background: #f6f8fc; }
    main { background: white; padding: 28px; border-radius: 16px; box-shadow: 0 8px 28px #17243715; }
    h1 { margin-top: 0; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; border: 1px solid #b7c1ce; border-radius: 8px; min-width: 0; }
    button { background: #1d4ed8; color: white; border: 0; border-radius: 8px; padding: 12px 18px; cursor: pointer; }
    button:disabled { opacity: .6; }
    #answer { white-space: pre-wrap; background: #f0f5ff; padding: 16px; min-height: 60px; border-radius: 8px; }
    small { color: #64748b; }
  </style>
</head>
<body>
  <main>
    <h1>AI Chatbot (FastAPI + Ollama)</h1>
    <p>Ask Llama 3.2 anything. This page is served by FastAPI.</p>
    <form id="chat-form">
      <input id="message" maxlength="2000" placeholder="Write your message" required>
      <button id="send" type="submit">Send</button>
    </form>
    <h2>Response</h2>
    <div id="answer" role="status" aria-live="polite">Your answer appears here.</div>
    <small>CI tests do not require Ollama; chatting does.</small>
  </main>
  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const answer = document.getElementById('answer');
    const send = document.getElementById('send');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      send.disabled = true;
      answer.textContent = 'Thinking...';
      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await response.json();
        answer.textContent = response.ok ? data.answer : (data.detail || 'Request failed');
      } catch {
        answer.textContent = 'Network error. Is FastAPI running?';
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
